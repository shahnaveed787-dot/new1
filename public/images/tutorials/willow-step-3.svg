<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Willow tree drawing step 3 texture and shading">
  <rect width="800" height="560" fill="#FFF9EF"/>
  <text x="40" y="48" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F7A44">Step 3  Texture &amp; shading</text>
  <text x="40" y="78" font-family="Nunito, Arial, sans-serif" font-size="15" fill="#4A5D50">Bark detail, soft canopy edges, and shadow under foliage</text>
  <!-- water/ground -->
  <ellipse cx="400" cy="508" rx="250" ry="20" fill="#D4EEF9"/>
  <ellipse cx="400" cy="500" rx="200" ry="12" fill="#E8F8EE"/>
  <!-- shaded trunk -->
  <path d="M385 220 C378 310 372 400 365 485" fill="#6B4423"/>
  <path d="M385 220 C392 310 398 400 405 485" fill="#8B5E3C"/>
  <path d="M395 220 C398 310 400 400 402 485" fill="#A67C52" opacity="0.5"/>
  <!-- bark lines -->
  <g stroke="#5A3A20" stroke-width="1.5" opacity="0.7">
    <path d="M388 260 L400 258"/>
    <path d="M387 300 L401 297"/>
    <path d="M386 340 L402 336"/>
    <path d="M385 380 L403 376"/>
    <path d="M384 420 L404 415"/>
    <path d="M383 455 L403 450"/>
  </g>
  <!-- canopy mass -->
  <ellipse cx="400" cy="185" rx="175" ry="75" fill="#1F7A44"/>
  <ellipse cx="370" cy="200" rx="90" ry="50" fill="#2E9E5B"/>
  <ellipse cx="440" cy="195" rx="95" ry="55" fill="#2E9E5B"/>
  <ellipse cx="400" cy="165" rx="120" ry="45" fill="#3CB371"/>
  <!-- hanging foliage with depth -->
  <g stroke-linecap="round">
    <path d="M255 205 C250 290 240 380 232 470" fill="none" stroke="#145C32" stroke-width="7"/>
    <path d="M280 190 C274 285 262 375 254 478" fill="none" stroke="#1F7A44" stroke-width="8"/>
    <path d="M310 175 C305 275 295 375 288 485" fill="none" stroke="#2E9E5B" stroke-width="7"/>
    <path d="M340 168 C337 270 330 380 326 488" fill="none" stroke="#145C32" stroke-width="8"/>
    <path d="M370 162 C368 265 364 380 362 490" fill="none" stroke="#1F7A44" stroke-width="7"/>
    <path d="M400 158 C400 260 400 380 400 492" fill="none" stroke="#2E9E5B" stroke-width="8"/>
    <path d="M430 162 C432 265 436 380 438 490" fill="none" stroke="#145C32" stroke-width="7"/>
    <path d="M460 168 C463 270 470 380 474 488" fill="none" stroke="#1F7A44" stroke-width="8"/>
    <path d="M490 175 C495 275 505 375 512 485" fill="none" stroke="#2E9E5B" stroke-width="7"/>
    <path d="M520 190 C526 285 538 375 546 478" fill="none" stroke="#145C32" stroke-width="8"/>
    <path d="M545 205 C550 290 560 380 568 470" fill="none" stroke="#1F7A44" stroke-width="7"/>
  </g>
  <!-- soft leaf tips -->
  <g fill="#3CB371" opacity="0.85">
    <ellipse cx="250" cy="300" rx="8" ry="18" transform="rotate(-8 250 300)"/>
    <ellipse cx="290" cy="340" rx="7" ry="16" transform="rotate(5 290 340)"/>
    <ellipse cx="510" cy="330" rx="8" ry="17" transform="rotate(-5 510 330)"/>
    <ellipse cx="545" cy="290" rx="7" ry="15" transform="rotate(8 545 290)"/>
  </g>
  <!-- shadow under canopy -->
  <ellipse cx="400" cy="250" rx="140" ry="25" fill="#0F3D22" opacity="0.18"/>
  <text x="560" y="260" font-family="Nunito, Arial, sans-serif" font-size="14" fill="#4A5D50">shadow under</text>
  <text x="560" y="280" font-family="Nunito, Arial, sans-serif" font-size="14" fill="#4A5D50">hanging foliage</text>
</svg>
