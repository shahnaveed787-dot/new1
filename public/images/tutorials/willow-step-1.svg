<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Willow tree drawing step 1 basic structure">
  <rect width="800" height="560" fill="#FFF9EF"/>
  <text x="40" y="48" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F7A44">Step 1  Basic structure</text>
  <text x="40" y="78" font-family="Nunito, Arial, sans-serif" font-size="15" fill="#4A5D50">Curved trunk + umbrella canopy guidelines</text>
  <!-- ground -->
  <ellipse cx="400" cy="500" rx="220" ry="18" fill="#E8F8EE"/>
  <!-- trunk -->
  <path d="M392 250 C386 320 380 400 372 480" fill="none" stroke="#8B5E3C" stroke-width="18" stroke-linecap="round"/>
  <path d="M408 250 C414 320 420 400 428 480" fill="none" stroke="#A67C52" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <!-- main branches -->
  <path d="M400 250 C340 230 280 250 240 310" fill="none" stroke="#8B5E3C" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 250 C460 230 520 250 560 310" fill="none" stroke="#8B5E3C" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 240 C360 200 300 190 260 220" fill="none" stroke="#8B5E3C" stroke-width="7" stroke-linecap="round"/>
  <path d="M400 240 C440 200 500 190 540 220" fill="none" stroke="#8B5E3C" stroke-width="7" stroke-linecap="round"/>
  <path d="M400 235 C400 200 400 180 400 160" fill="none" stroke="#8B5E3C" stroke-width="6" stroke-linecap="round"/>
  <!-- umbrella canopy guide -->
  <ellipse cx="400" cy="210" rx="190" ry="95" fill="none" stroke="#2E9E5B" stroke-width="3" stroke-dasharray="10 8" opacity="0.85"/>
  <path d="M220 240 C280 300 360 320 400 320 C440 320 520 300 580 240" fill="none" stroke="#3FA9F5" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7"/>
  <!-- labels -->
  <text x="470" y="170" font-family="Nunito, Arial, sans-serif" font-size="14" fill="#1E8AD6">umbrella canopy</text>
  <text x="450" y="400" font-family="Nunito, Arial, sans-serif" font-size="14" fill="#6B4423">gentle curve</text>
</svg>
